[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specrsi-research"
version = "0.1.0"
description = "Verification-aware search and grouped learning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11", "PyYAML>=6", "httpx>=0.27"]

[project.optional-dependencies]
models = ["torch>=2.6", "transformers==4.57.6", "huggingface-hub==0.36.2", "peft==0.18.1", "accelerate>=1.2", "fastapi>=0.115", "uvicorn>=0.30"]
data = ["datasets==3.6.0", "requests>=2.31", "pandas>=2", "pyarrow>=15"]
solver = ["pyomo==6.9.5", "highspy==1.12.0"]
test = ["pytest>=8"]

[project.scripts]
specrsi = "specrsi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]


[tool.setuptools.package-data]
"specrsi.science" = ["*.cc"]
