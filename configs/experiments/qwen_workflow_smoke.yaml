schema_version: 1
dataset: game24
data_root: data
selection_limit: 1
audit_limit: 1
seed: 20260916
model:
  lock: configs/models/qwen35_35b_a3b_bf16.lock.json
  base_url: http://127.0.0.1:18085
  max_tokens: 160
  temperature: 0.0
  enable_thinking: false
search:
  controller: heuristic_bootstrap
  budget_tokens: 30000
  max_actions: 3
  max_candidates: 2
  eta: 0.005
  cost_lambda: 1.0e-06
  reuse: all_U
  initial_workflow:
    nodes:
    - id: solve
      instruction: Find an arithmetic expression equal to 24 using each given number
        exactly once. You may use +, -, *, / and parentheses. Output only the expression,
        without explanation or '= 24'.
      dependencies: []
    - id: review
      instruction: Check the previous solution carefully and return a corrected final
        answer. Find an arithmetic expression equal to 24 using each given number
        exactly once. You may use +, -, *, / and parentheses. Output only the expression,
        without explanation or '= 24'.
      dependencies:
      - solve
    output_node: review
output: results/qwen35/experiments/qwen_workflow_smoke
