audit_limit: 10
data_root: data
dataset: math
model:
  base_url: http://127.0.0.1:18085
  enable_thinking: false
  lock: configs/models/qwen35_35b_a3b_bf16.lock.json
  max_tokens: 2048
  temperature: 0.7
output: results/qwen35/experiments/prospective/math_workflow
schema_version: 1
search:
  budget_tokens: 500000
  controller: heuristic_bootstrap
  cost_lambda: 1.0e-06
  eta: 0.005
  max_actions: 20
  max_candidates: 6
  reuse: all_U
  execution_cap_tokens: 32768
  initial_cap_tokens: 65536
  initial_workflow:
    nodes:
    - id: solve
      instruction: Solve the mathematics problem carefully. Put the final answer in
        \boxed{}.
      dependencies: []
    - id: review
      instruction: Check the previous solution carefully, correct any errors, and
        return the required final answer. Solve the mathematics problem carefully.
        Put the final answer in \boxed{}.
      dependencies:
      - solve
    output_node: review
seed: 20260916
selection_limit: 10
metric_variant: aflow_math_equal
